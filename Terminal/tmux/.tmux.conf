# ~/.tmux.conf
##### CORE SETTINGS #####

# Enable mouse support
set -g mouse on

# Reduce escape delay (fix mouse / fzf lag)
set -sg escape-time 0

# Scrollback history
set -g history-limit 10000

# Preserve scrollback on clear/reset
set -g alternate-screen off

# Terminal + cursor (Ghostty thin bar)
set -g default-terminal "xterm-256color"
set -as terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[6 q'

##### PANE & WINDOW BEHAVIOR #####

# Open new panes in current directory
bind '"' split-window -v -c "#{pane_current_path}" \; send-keys Escape
bind % split-window -h -c "#{pane_current_path}" \; send-keys Escape

# Open new windows in current directory
bind c new-window -c "#{pane_current_path}"

# Run fastfetch on every new pane/window
set -g default-command "zsh -lc 'fastfetch; exec zsh'"


##### MOUSE + COPY MODE STABILITY FIXES #####

# Exit copy-mode when clicking
bind -n MouseDown1Pane select-pane \; send-keys -M

# Proper scroll behavior
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" \
  "send-keys -M" \
  "copy-mode -e"

bind -n WheelDownPane send-keys -M

# Safe redraw (keeps history)
bind -n C-l send-keys C-l


##### STATUS BAR – CLEAN & MINIMAL #####

# Enable status bar
set -g status on
set -g status-interval 2
set -g status-position bottom

# Style
set -g status-style "bg=default,fg=colour8"
set -g status-left-length 100
set -g status-right-length 50

# Left: hostname | pwd | tun0
set -g status-left "#[fg=colour45]#H #[fg=colour8]| #[fg=colour39]#{=/-20/...:pane_current_path} #[fg=colour8]| #[fg=colour45]#(~/.tmux-vpn.sh)"

# Right: empty (clean)
set -g status-right ""

##### MESSAGE STYLE #####

set -g message-style "bg=default,fg=colour10"

##### WINDOW / PANE VISIBILITY #####

# Pane borders (keep them)
set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour10"

# Window list styles
setw -g window-status-format "#[fg=colour8] #I:#W "
setw -g window-status-current-format "#[fg=colour10,bold] #I:#W "

# Rename windows automatically to current command
setw -g automatic-rename on
setw -g automatic-rename-format "#{pane_current_command}"

setw -g window-status-separator "  "
set -g status-left-length 50

# Truecolor support over SSH
set -as terminal-overrides ",xterm-256color:Tc"

##### GLOBAL TMUX UI COLORS (SOFT SKY BLUE) #####

# Copy-mode & mouse selection (no yellow)
set -g mode-style "fg=default,bg=colour39"

# Message / command prompt
set -g message-style "fg=colour39,bg=default"

# Pane number overlay (prefix + q)
set -g display-panes-colour colour39
set -g display-panes-active-colour colour45
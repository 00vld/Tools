# ~/.tmux.conf

##### CORE SETTINGS

set -g mouse on
bind m set -g mouse
set -sg escape-time 0
set -g history-limit 100000
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"
setw -g mode-keys vi

##### PANE & WINDOW BEHAVIOR

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

##### COPY MODE / SCROLL

bind -n PageUp copy-mode -e
bind -n WheelUpPane if-shell -F "#{mouse_any_flag}" "send-keys -M" "copy-mode -e"
bind -n WheelDownPane send-keys -M

##### TERMINAL STABILITY

bind -n C-l send-keys C-l

##### STATUS BAR

set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-style "bg=default,fg=colour8"
set -g status-left-length 80
set -g status-right-length 50

# Left: hostname | current path
set -g status-left "#[fg=colour45]#H #[fg=colour8]| #[fg=colour39]#{=/-20/...:pane_current_path}"

# Right: VPN IP — use full path, ~ doesn't expand in #()
set -g status-right "#[fg=colour8]vpn #[fg=colour82]#(sh /home/arch/.tmux.vpn.sh)"

##### WINDOW / PANE STYLE

set -g pane-border-style "fg=colour8"
set -g pane-active-border-style "fg=colour10"
setw -g window-status-format "#[fg=colour8] #I:#W "
setw -g window-status-current-format "#[fg=colour10,bold] #I:#W "
setw -g automatic-rename on
setw -g automatic-rename-format "#{pane_current_command}"
setw -g window-status-separator "  "

##### COLORS

set -g mode-style "fg=default,bg=colour39"
set -g message-style "fg=colour39,bg=default"
set -g display-panes-colour colour39
set -g display-panes-active-colour colour45
